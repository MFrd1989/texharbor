services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-texharbor}
      POSTGRES_USER: ${POSTGRES_USER:-texharbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    image: ${APP_IMAGE:-texharbor-app:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://texharbor:change-me@db:5432/texharbor}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      STORAGE_ROOT: /data/projects
    ports:
      - "3000:3000"
    volumes:
      - project-storage:/data/projects

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ${WORKER_IMAGE:-texharbor-worker:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://texharbor:change-me@db:5432/texharbor}
      STORAGE_ROOT: /data/projects
      COMPILER_IMAGE: ${COMPILER_IMAGE:-texharbor-compiler:latest}
      PROJECT_VOLUME: ${PROJECT_VOLUME:-texharbor-project-storage}
    volumes:
      - project-storage:/data/projects
      - /var/run/docker.sock:/var/run/docker.sock

  compiler:
    build:
      context: .
      dockerfile: Dockerfile.compiler
    image: ${COMPILER_IMAGE:-texharbor-compiler:latest}
    profiles: ["build-only"]

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME:-texharbor-postgres-data}
  project-storage:
    name: ${PROJECT_VOLUME:-texharbor-project-storage}
